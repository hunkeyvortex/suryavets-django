{% if form.non_field_errors %}<div class="auth-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="auth-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label><div class="auth-input-wrap">{{ field }}{% if field.field.widget.input_type == 'password' %}<button type="button" class="auth-password-toggle" aria-controls="{{ field.id_for_label }}" aria-pressed="false" aria-label="Show {{ field.label|lower }}" data-password-toggle>Show</button>{% endif %}</div>{% if field.errors %}<div class="auth-field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}{% if field.help_text %}<div class="auth-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}</div>{% endfor %}
