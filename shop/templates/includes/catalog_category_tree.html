{% for node in nodes %}<li>{% if node.menu_children %}<details{% if category.pk == node.pk %} open{% endif %}><summary>{{ node.name }}</summary><a href="{{ node.get_absolute_url }}">Shop all {{ node.name }}</a><ul>{% include 'includes/catalog_category_tree.html' with nodes=node.menu_children %}</ul></details>{% else %}<a href="{{ node.get_absolute_url }}"{% if category.pk == node.pk %} aria-current="page"{% endif %}>{{ node.name }}</a>{% endif %}</li>{% endfor %}
