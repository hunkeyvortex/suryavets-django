<div class="checkout-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.errors %}<div class="checkout-field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
  {% if field.help_text %}<p class="checkout-small" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
