{% extends 'crm/base.html' %}{% block content %}<p class="muted">{{ page.paginator.count }} orders · Customer information is visible only to authorized staff.</p>
<form class="filters" method="get"><label>Search<input type="search" name="q" value="{{ q }}" placeholder="Order, name, email or phone"></label><label>Order status<select name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Payment<select name="payment"><option value="">All payments</option>{% for value,label in payments %}<option value="{{ value }}" {% if value == payment %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button>Apply filters</button><a href="{% url 'crm:orders' %}">Reset</a></form>
<section class="panel">{% include 'crm/order_table.html' with orders=page %}{% include 'crm/pagination.html' %}</section>{% endblock %}
