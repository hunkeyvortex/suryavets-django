<ol class="activity">{% for event in activity %}<li><p>{{ event.text|linebreaksbr }}</p><small>{{ event.actor.get_username|default:'Former staff' }} · {{ event.created_at|date:'d M Y, H:i' }}{% if event.order %} · <a href="{% url 'crm:order_detail' event.order.pk %}">{{ event.order.order_number }}</a>{% endif %}</small></li>{% empty %}<li class="muted">No internal activity yet.</li>{% endfor %}</ol>
